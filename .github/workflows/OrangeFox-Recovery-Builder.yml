name: OrangeFox for OnePlus 6T

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '11.0'
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/TeamWin/android_device_oneplus_fajita'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'twrp-11.0'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/oneplus/fajita'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'fajita'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 bc ccache imagemagick schedtool libssl-dev patchelf

      - name: Sync OrangeFox
        run: |
          mkdir -p OrangeFox
          cd OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git
          ./sync/setup.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Clone Device Tree
        run: |
          cd OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Build OrangeFox
        run: |
          cd OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng
          mka recoveryimage

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_Recovery_fajita
          path: OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
